<!-- tickets.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tickets &mdash; Untrained Momentum</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <div class="topbar-logo">Untrained <span>Momentum</span></div>
    <div class="topbar-spacer"></div>
    <div class="topbar-user"><span class="nav-user-name" id="nav-name"></span><span class="nav-user-role" id="nav-role"></span></div>
    <button class="btn-logout" onclick="logout()">Sign Out</button>
  </div>
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Main</div>
      <a class="nav-link sidebar-link" href="dashboard.html">Dashboard</a>
      <a class="nav-link sidebar-link admin-only" href="clients.html">Clients</a>
      <a class="nav-link sidebar-link active admin-only" href="tickets.html">Tickets</a>
    </div>
    <div class="sidebar-section"><div class="sidebar-label">Sales</div><a class="nav-link sidebar-link" href="john.html">John's View</a></div>
  </div>
  <div class="main-content">
    <div class="page-header">
      <div><div class="page-title">Tickets</div><div class="page-subtitle" id="count"></div></div>
    </div>
    <div class="filter-bar mb-16">
      <select class="filter-select" id="f-status" onchange="load()">
        <option value="open">Open</option><option value="in_progress">In Progress</option>
        <option value="resolved">Resolved</option><option value="">All</option>
      </select>
      <select class="filter-select" id="f-priority" onchange="load()">
        <option value="">All Priorities</option><option value="urgent">Urgent</option>
        <option value="normal">Normal</option><option value="low">Low</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Client</th><th>From</th><th>Subject</th><th>Priority</th><th>Status</th><th>Received</th><th></th></tr></thead>
        <tbody id="tbody"><tr><td colspan="7" class="loading">Loading&hellip;</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<!-- TICKET MODAL -->
<div class="modal-overlay" id="t-modal" style="display:none">
  <div class="modal" style="max-width:580px">
    <div class="modal-header"><div class="modal-title" id="tm-subject"></div><button class="modal-close" onclick="document.getElementById('t-modal').style.display='none'">&times;</button></div>
    <div class="modal-body">
      <div class="form-grid-2" style="margin-bottom:16px">
        <div><div class="text-xs text-mid mb-8">CLIENT</div><div id="tm-client" class="text-bold"></div></div>
        <div><div class="text-xs text-mid mb-8">FROM</div><div id="tm-by"></div></div>
        <div><div class="text-xs text-mid mb-8">PRIORITY</div><div id="tm-priority"></div></div>
        <div><div class="text-xs text-mid mb-8">STATUS</div><div id="tm-status"></div></div>
      </div>
      <div style="margin-bottom:16px">
        <div class="text-xs text-mid mb-8">DESCRIPTION</div>
        <div id="tm-desc" style="font-size:13px;line-height:1.7;background:var(--light);padding:12px;border-radius:var(--r)"></div>
      </div>
      <div class="form-group"><label class="form-label">Update Status</label>
        <select class="form-control" id="tm-new-status">
          <option value="open">Open</option><option value="in_progress">In Progress</option>
          <option value="resolved">Resolved</option><option value="closed">Closed</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Resolution Notes</label>
        <textarea class="form-control" id="tm-notes" rows="3" placeholder="What was done to resolve this?"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="document.getElementById('t-modal').style.display='none'">Close</button>
      <button class="btn btn-primary" onclick="update()">Update Ticket</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="shared.js"></script>
<script>
let currentId = null;

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.replace('index.html'); return; }
  let p = { id: session.user.id, email: session.user.email, role: 'admin', full_name: 'Jen' };
  try { const { data } = await sb.from('profiles').select('*').eq('id', session.user.id).single(); if (data) p = data; } catch(e) {}
  renderNav(p);
  await load();
})();

async function load() {
  const s = document.getElementById('f-status').value;
  const p = document.getElementById('f-priority').value;
  let q = sb.from('tickets').select('*,clients(business_name)').order('created_at', { ascending: false });
  if (s) q = q.eq('status', s);
  if (p) q = q.eq('priority', p);
  const { data } = await q;
  const tickets = data || [];
  document.getElementById('count').textContent = `${tickets.length} ticket${tickets.length !== 1 ? 's' : ''}`;
  const b = document.getElementById('tbody');
  if (!tickets.length) { b.innerHTML = '<tr><td colspan="7"><div class="empty-state"><div class="empty-state-text">No tickets</div></div></td></tr>'; return; }
  b.innerHTML = tickets.map(t => `
    <tr>
      <td class="text-sm">${t.clients?.business_name||'&mdash;'}</td>
      <td class="text-sm">${t.submitted_by_name}</td>
      <td>${t.subject}</td>
      <td><span class="badge badge-${t.priority}">${t.priority}</span></td>
      <td><span class="badge badge-${t.status==='closed'?'closed-t':t.status}">${t.status.replace('_',' ')}</span></td>
      <td class="text-sm text-mid">${fmtDate(t.created_at)}</td>
      <td><button class="btn btn-secondary btn-sm" onclick='open_t(${JSON.stringify(t)})'>View</button></td>
    </tr>`).join('');
}

function open_t(t) {
  currentId = t.id;
  document.getElementById('tm-subject').textContent  = t.subject;
  document.getElementById('tm-client').textContent   = t.clients?.business_name || '—';
  document.getElementById('tm-by').textContent       = t.submitted_by_name;
  document.getElementById('tm-priority').innerHTML   = `<span class="badge badge-${t.priority}">${t.priority}</span>`;
  document.getElementById('tm-status').innerHTML     = `<span class="badge badge-${t.status}">${t.status.replace('_',' ')}</span>`;
  document.getElementById('tm-desc').textContent     = t.description;
  document.getElementById('tm-new-status').value     = t.status;
  document.getElementById('tm-notes').value          = t.resolution_notes || '';
  document.getElementById('t-modal').style.display   = 'flex';
}

async function update() {
  if (!currentId) return;
  const s = document.getElementById('tm-new-status').value;
  const n = document.getElementById('tm-notes').value;
  const u = { status: s };
  if (n) { u.resolution_notes = n; u.resolved_at = new Date().toISOString(); }
  const { error } = await sb.from('tickets').update(u).eq('id', currentId);
  if (error) { toast('Error: ' + error.message, 'error'); return; }
  toast('Ticket updated!');
  document.getElementById('t-modal').style.display = 'none';
  await load();
}
</script>
</body>
</html>
