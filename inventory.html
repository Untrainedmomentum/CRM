<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Inventory — Untrained Momentum</title><link rel="stylesheet" href="style.css">
  <style>
    .inventory-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.inv-card{background:#fff;border:1px solid var(--border);border-radius:var(--r2);padding:18px;box-shadow:var(--sh2)}.inv-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.inv-name{font-weight:700;font-size:15px}.inv-sku{font-size:11px;color:var(--mid);margin-top:3px}.qty{font-family:var(--font-d);font-size:28px;font-weight:700}.low{color:var(--red)}.inv-meta{font-size:12px;color:var(--mid);margin:12px 0}.move-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}.move-form .wide{grid-column:1/-1}.history-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}.history-row:last-child{border-bottom:none}.summary-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}@media(max-width:850px){.summary-strip{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body><div class="app-shell">
<div class="topbar"><div class="topbar-logo">Untrained <span>Momentum</span></div><div class="topbar-spacer"></div><div class="topbar-user"><span id="nav-name" class="nav-user-name"></span><span id="nav-role" class="nav-user-role"></span></div><button class="btn-logout" onclick="logout()">Sign Out</button></div>
<div class="sidebar"><div class="sidebar-section"><div class="sidebar-label">Main</div><a class="nav-link sidebar-link" href="dashboard.html">Dashboard</a><a class="nav-link sidebar-link" href="clients.html">Clients</a><a class="nav-link sidebar-link" href="work.html">Work</a><a class="nav-link sidebar-link" href="tickets.html">Tickets</a></div><div class="sidebar-section"><div class="sidebar-label">Sales</div><a class="nav-link sidebar-link" href="john.html">John's View</a></div><div class="sidebar-section"><div class="sidebar-label">Operations</div><a class="nav-link sidebar-link" href="inventory.html">Inventory</a><a class="nav-link sidebar-link" href="subscriptions.html">Subscriptions</a></div></div>
<div class="main-content"><div class="page-header"><div><div class="page-title">Inventory</div><div class="page-subtitle">Parts, equipment, purchases, job usage, sales, returns, and adjustments</div></div><button class="btn btn-primary" onclick="openModal()">+ Add Item</button></div>
<div class="summary-strip"><div class="stat-card"><div class="stat-label">Items</div><div id="s-items" class="stat-value">—</div></div><div class="stat-card gold"><div class="stat-label">Units On Hand</div><div id="s-units" class="stat-value">—</div></div><div class="stat-card green"><div class="stat-label">Inventory Cost</div><div id="s-cost" class="stat-value">—</div></div><div class="stat-card blue"><div class="stat-label">Low Stock</div><div id="s-low" class="stat-value">—</div></div></div>
<div class="filter-bar mb-16"><input id="search" class="search-input" placeholder="Search item, SKU, category, location…" oninput="render()"><select id="f-low" class="filter-select" onchange="render()"><option value="">All stock</option><option value="low">Low stock only</option></select></div>
<div id="inventory-list" class="inventory-grid"><div class="loading">Loading inventory…</div></div></div></div>
<div class="modal-overlay" id="item-modal" style="display:none"><div class="modal" style="max-width:600px"><div class="modal-header"><div class="modal-title">Add Inventory Item</div><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid-2"><div class="form-group"><label class="form-label">Item Name</label><input id="i-name" class="form-control"></div><div class="form-group"><label class="form-label">SKU</label><input id="i-sku" class="form-control"></div></div><div class="form-grid-2"><div class="form-group"><label class="form-label">Category</label><input id="i-cat" class="form-control"></div><div class="form-group"><label class="form-label">Location</label><input id="i-loc" class="form-control"></div></div><div class="form-grid-2"><div class="form-group"><label class="form-label">Reorder Level</label><input id="i-reorder" type="number" min="0" step="1" value="0" class="form-control"></div><div class="form-group"><label class="form-label">Unit Cost ($)</label><input id="i-cost" type="number" min="0" step=".01" class="form-control"></div></div><div class="form-group"><label class="form-label">Notes</label><textarea id="i-notes" rows="3" class="form-control"></textarea></div></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="addItem()">Create Item</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="shared.js"></script>
<script>
let profile,items=[],movements=[],clients=[],work=[];const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const usd=c=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(c||0)/100);
(async()=>{profile=await requireAuth('admin');if(!profile)return;renderNav(profile);const [ir,mr,cr,wr]=await Promise.all([sb.from('inventory_items').select('*').eq('active',true).order('name'),sb.from('inventory_movements').select('*').order('occurred_at',{ascending:false}).limit(300),sb.from('clients').select('id,business_name').order('business_name'),sb.from('work_orders').select('id,title,client_id').order('created_at',{ascending:false}).limit(200)]);items=ir.data||[];movements=mr.data||[];clients=cr.data||[];work=wr.data||[];render();stats()})();
function stats(){document.getElementById('s-items').textContent=items.length;document.getElementById('s-units').textContent=items.reduce((s,x)=>s+Number(x.quantity_on_hand||0),0).toLocaleString();document.getElementById('s-cost').textContent=usd(items.reduce((s,x)=>s+Math.round(Number(x.quantity_on_hand||0)*Number(x.unit_cost_cents||0)),0));document.getElementById('s-low').textContent=items.filter(x=>Number(x.quantity_on_hand||0)<=Number(x.reorder_level||0)).length}
function render(){const q=(document.getElementById('search').value||'').toLowerCase(),low=document.getElementById('f-low').value==='low';const rows=items.filter(x=>(!low||Number(x.quantity_on_hand||0)<=Number(x.reorder_level||0))&&(!q||[x.name,x.sku,x.category,x.location].some(v=>String(v||'').toLowerCase().includes(q))));document.getElementById('inventory-list').innerHTML=rows.length?rows.map(item=>{const hist=movements.filter(m=>m.inventory_item_id===item.id).slice(0,5),isLow=Number(item.quantity_on_hand||0)<=Number(item.reorder_level||0);return `<div class="inv-card"><div class="inv-top"><div><div class="inv-name">${esc(item.name)}</div><div class="inv-sku">${esc(item.sku||'No SKU')} · ${esc(item.category||'Uncategorized')} · ${esc(item.location||'No location')}</div></div><div class="qty ${isLow?'low':''}">${Number(item.quantity_on_hand||0)}</div></div><div class="inv-meta">Reorder at ${Number(item.reorder_level||0)}${item.unit_cost_cents!=null?' · '+usd(item.unit_cost_cents)+' cost':''}</div><div class="move-form"><select class="form-control" id="type-${item.id}"><option value="purchase">Purchase / Add</option><option value="job_use">Used on Job</option><option value="sale">Sold</option><option value="return">Returned</option><option value="adjustment">Adjustment</option></select><input class="form-control" id="qty-${item.id}" type="number" step="1" placeholder="Qty"><select class="form-control wide" id="client-${item.id}"><option value="">No client</option>${clients.map(c=>`<option value="${c.id}">${esc(c.business_name)}</option>`).join('')}</select><input class="form-control wide" id="note-${item.id}" placeholder="Movement note"><button class="btn btn-secondary wide" onclick="postMovement('${item.id}')">Post Inventory Movement</button></div>${hist.length?`<div style="margin-top:14px"><div class="form-label">Recent history</div>${hist.map(h=>`<div class="history-row"><span>${esc(h.movement_type.replaceAll('_',' '))}${h.notes?' · '+esc(h.notes):''}</span><strong class="${Number(h.quantity_delta)<0?'low':''}">${Number(h.quantity_delta)>0?'+':''}${Number(h.quantity_delta)}</strong></div>`).join('')}</div>`:''}</div>`}).join(''):'<div class="card"><div class="empty-state-text">No inventory items found.</div></div>'}
async function postMovement(id){const type=document.getElementById('type-'+id).value,raw=Number(document.getElementById('qty-'+id).value||0),client_id=document.getElementById('client-'+id).value||null,notes=document.getElementById('note-'+id).value.trim()||null;if(!raw)return toast('Enter a quantity','error');let delta=Math.abs(raw);if(['job_use','sale'].includes(type))delta=-delta;if(type==='adjustment')delta=raw;const{data,error}=await sb.from('inventory_movements').insert({inventory_item_id:id,client_id,movement_type:type,quantity_delta:delta,notes,created_by:profile.id}).select().single();if(error)return toast(error.message,'error');movements.unshift(data);const{data:updated}=await sb.from('inventory_items').select('*').eq('id',id).single();items[items.findIndex(x=>x.id===id)]=updated;render();stats();toast('Inventory updated')}
function openModal(){document.getElementById('item-modal').style.display='flex'}function closeModal(){document.getElementById('item-modal').style.display='none'}
async function addItem(){const name=document.getElementById('i-name').value.trim();if(!name)return toast('Enter an item name','error');const body={name,sku:document.getElementById('i-sku').value.trim()||null,category:document.getElementById('i-cat').value.trim()||null,location:document.getElementById('i-loc').value.trim()||null,reorder_level:Number(document.getElementById('i-reorder').value||0),unit_cost_cents:document.getElementById('i-cost').value===''?null:Math.round(Number(document.getElementById('i-cost').value)*100),notes:document.getElementById('i-notes').value.trim()||null};const{data,error}=await sb.from('inventory_items').insert(body).select().single();if(error)return toast(error.message,'error');items.push(data);items.sort((a,b)=>a.name.localeCompare(b.name));closeModal();render();stats();toast('Inventory item created')}
</script></body></html>
