<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Bookings — Untrained Momentum</title><link rel="stylesheet" href="style.css">
  <style>
    .booking-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.booking-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px}.booking-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.booking-title{font-weight:800;font-size:15px}.booking-meta{font-size:12px;color:var(--mid);margin-top:4px;line-height:1.5}.booking-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.booking-actions select{width:auto;min-width:135px}.booking-contact{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;font-size:12px}.booking-contact a{color:var(--blue)}.pill{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:4px 8px;border-radius:999px;background:#eee}.pill.booked{background:#eaf2ff;color:#1d4ed8}.pill.confirmed{background:#e8f6ec;color:#166534}.pill.cancelled,.pill.no_show{background:#fdecec;color:#991b1b}.pill.completed{background:#eee;color:#333}@media(max-width:850px){.booking-stats{grid-template-columns:repeat(2,1fr)}}
  </style>
</head>
<body><div class="app-shell">
<div class="topbar"><div class="topbar-logo">Untrained <span>Momentum</span></div><div class="topbar-spacer"></div><div class="topbar-user"><span id="nav-name" class="nav-user-name"></span><span id="nav-role" class="nav-user-role"></span></div><button class="btn-logout" onclick="logout()">Sign Out</button></div>
<div class="sidebar"><div class="sidebar-section"><div class="sidebar-label">Main</div><a class="nav-link sidebar-link" href="dashboard.html">Dashboard</a><a class="nav-link sidebar-link admin-only" href="clients.html">Clients</a><a class="nav-link sidebar-link" href="work.html">Work</a><a class="nav-link sidebar-link admin-only" href="tickets.html">Tickets</a></div><div class="sidebar-section"><div class="sidebar-label">Sales</div><a class="nav-link sidebar-link" href="john.html">John's View</a></div></div>
<div class="main-content">
  <div class="page-header"><div><div class="page-title">Bookings</div><div class="page-subtitle">Appointments, customer details, CRM matching and follow-up.</div></div><button class="btn btn-secondary" onclick="loadBookings()">Refresh</button></div>
  <div class="booking-stats"><div class="stat-card"><div class="stat-label">Upcoming</div><div class="stat-value" id="s-upcoming">—</div></div><div class="stat-card green"><div class="stat-label">Today</div><div class="stat-value" id="s-today">—</div></div><div class="stat-card gold"><div class="stat-label">Not Linked to CRM</div><div class="stat-value" id="s-unlinked">—</div></div><div class="stat-card blue"><div class="stat-label">This Month</div><div class="stat-value" id="s-month">—</div></div></div>
  <div class="filter-bar mb-16"><input class="search-input" id="search" placeholder="Search name, email, phone or service…" oninput="renderBookings()"><select class="filter-select" id="f-status" onchange="renderBookings()"><option value="upcoming">Upcoming</option><option value="all">All bookings</option><option value="booked">Booked</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option><option value="no_show">No-show</option></select></div>
  <div id="booking-list"><div class="loading">Loading bookings…</div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/config.js"></script><script src="shared.js"></script>
<script>
let profile, bookings=[];
(async()=>{profile=await requireAuth('admin');if(!profile)return;renderNav(profile);await loadBookings()})();
const moneyDate=d=>new Date(d).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
async function loadBookings(){const{data,error}=await sb.from('bookings').select('*,clients(id,business_name)').order('starts_at',{ascending:true});if(error)return toast(error.message,'error');bookings=data||[];updateStats();renderBookings()}
function updateStats(){const now=new Date(),today=now.toDateString(),month=now.getMonth(),year=now.getFullYear();document.getElementById('s-upcoming').textContent=bookings.filter(b=>new Date(b.starts_at)>=now&&!['cancelled','completed','no_show'].includes(b.status)).length;document.getElementById('s-today').textContent=bookings.filter(b=>new Date(b.starts_at).toDateString()===today&&!['cancelled'].includes(b.status)).length;document.getElementById('s-unlinked').textContent=bookings.filter(b=>!b.client_id&&!['cancelled'].includes(b.status)).length;document.getElementById('s-month').textContent=bookings.filter(b=>{const d=new Date(b.starts_at);return d.getMonth()===month&&d.getFullYear()===year}).length}
function renderBookings(){const q=(document.getElementById('search').value||'').toLowerCase(),fs=document.getElementById('f-status').value,now=new Date();let rows=bookings.filter(b=>(fs==='all'||(fs==='upcoming'?(new Date(b.starts_at)>=now&&!['cancelled','completed','no_show'].includes(b.status)):b.status===fs))&&(!q||[b.customer_name,b.customer_email,b.customer_phone,b.service_type,b.location_text].some(x=>String(x||'').toLowerCase().includes(q))));const el=document.getElementById('booking-list');if(!rows.length){el.innerHTML='<div class="card"><div class="empty-state-text">No bookings match this view.</div></div>';return}el.innerHTML=rows.map(b=>`<div class="booking-card"><div class="booking-head"><div><div class="booking-title">${esc(b.service_type)} — ${esc(b.customer_name)}</div><div class="booking-meta">${moneyDate(b.starts_at)} to ${new Date(b.ends_at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}${b.location_text?' · '+esc(b.location_text):''}<br>${b.source==='google_appointment_schedule'?'Google Appointment Schedule':esc(b.source)}</div></div><span class="pill ${esc(b.status)}">${esc(b.status.replaceAll('_',' '))}</span></div><div class="booking-contact"><a href="mailto:${esc(b.customer_email)}">${esc(b.customer_email)}</a>${b.customer_phone?`<a href="tel:${esc(b.customer_phone)}">${esc(b.customer_phone)}</a>`:''}<span>${b.client_id?`CRM: <a href="client.html?id=${b.client_id}">${esc(b.clients?.business_name||'Linked record')}</a>`:'Not linked to CRM'}</span></div>${b.notes?`<div class="booking-meta" style="margin-top:9px">${esc(b.notes)}</div>`:''}<div class="booking-actions"><select class="form-control" onchange="setStatus('${b.id}',this.value)">${['booked','confirmed','completed','cancelled','no_show'].map(s=>`<option value="${s}" ${s===b.status?'selected':''}>${s.replaceAll('_',' ')}</option>`).join('')}</select>${!b.client_id?`<button class="btn btn-primary btn-sm" onclick="createProspect('${b.id}')">Create CRM Prospect</button>`:''}${b.client_id?`<a class="btn btn-secondary btn-sm" href="client.html?id=${b.client_id}">Open CRM Record</a>`:''}</div></div>`).join('')}
async function setStatus(id,status){const{error}=await sb.from('bookings').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(error)return toast(error.message,'error');const b=bookings.find(x=>x.id===id);if(b)b.status=status;updateStats();renderBookings();toast('Booking updated')}
async function createProspect(id){const b=bookings.find(x=>x.id===id);if(!b)return;const existing=await sb.from('clients').select('id,business_name,email').ilike('email',b.customer_email).limit(1);let client=existing.data?.[0];if(!client){const{data,error}=await sb.from('clients').insert({business_name:b.customer_name,owner_name:b.customer_name,email:b.customer_email,phone:b.customer_phone||null,status:'prospect',relationship_type:'prospect',lead_source:'website',lead_source_detail:'Appointment booking'}).select('id,business_name').single();if(error)return toast(error.message,'error');client=data}const{error}=await sb.from('bookings').update({client_id:client.id,updated_at:new Date().toISOString()}).eq('id',id);if(error)return toast(error.message,'error');await sb.from('client_activities').insert({client_id:client.id,activity_type:'meeting',direction:'inbound',subject:`Booked: ${b.service_type}`,summary:`Appointment booked for ${moneyDate(b.starts_at)} via ${b.source}.`,external_message_id:b.external_message_id||null,occurred_at:new Date().toISOString()});toast('Booking linked to CRM');await loadBookings()}
</script></body></html>
